<figure class="document-page"><figcaption>Page 4 of 16</figcaption><a href="pages/airline-performance-final-presentation/04.webp" target="_blank" rel="noopener noreferrer" aria-label="Enlarge page 4 (new tab)"><img src="pages/airline-performance-final-presentation/04.webp" width="1800" height="1013" loading="lazy" alt="Page 4 of JetBlue, Southwest, and Delta Performance Analysis"></a><details><summary>Page 4 text</summary><pre>Sustained Superior Performance?
Sustained superior performance: 
Profitability (ROIC) &amp; profit growth greater than that of most if not all others within the same industry.
To determine whether jetBlue/Southwest have achieved sustained superior performance, we can:
Analyze 5-7 year performance with income sheets and balance statements.
Compare companies to the NYSE Arca Airline Index (industry benchmark)
Look at graphs of performance over time
 Key decisions each company has made recently.
Evaluate consistency of outperformance over time.</pre></details></figure>
<figure class="document-page"><figcaption>Page 5 of 16</figcaption><a href="pages/airline-performance-final-presentation/05.webp" target="_blank" rel="noopener noreferrer" aria-label="Enlarge page 5 (new tab)"><img src="pages/airline-performance-final-presentation/05.webp" width="1800" height="1013" loading="lazy" alt="Page 5 of JetBlue, Southwest, and Delta Performance Analysis"></a><details><summary>Page 5 text</summary><pre>Financial Ratios
--Calculated using average values of the past 5 years--
Liquidity Ratios: - ability to meet short-term obligations
Current Ratio = Current Assets / Current Liabilities
Quick Ratio = (Current Assets - Inventories) / Current Liabilities
Leverage Ratios: - asses how much debt the company is using
Debt-to-Equity Ratio = Total Liabilities / Equity
Profitability Ratios: evaluation of how effectively the company generates profit
Basic Earnings Per Share = Profit / # of Common Stock Shares Outstanding
Net Profit Margin = Profit / Sales
Return on Assets = Profits / Assets
Return on Equity = Profits / Stockholder Equity
Activity Ratios: - evaluation of how effectively the company generates profit
Inventory Turnover = Cost of Goods Sold / Average Inventory
Asset Turnover Ratio = Sales / Total Assets</pre></details></figure>
<figure class="document-page"><figcaption>Page 6 of 16</figcaption><a href="pages/airline-performance-final-presentation/06.webp" target="_blank" rel="noopener noreferrer" aria-label="Enlarge page 6 (new tab)"><img src="pages/airline-performance-final-presentation/06.webp" width="1800" height="1013" loading="lazy" alt="Page 6 of JetBlue, Southwest, and Delta Performance Analysis"></a><details><summary>Page 6 text</summary><pre>jetBlue

“JetForward” Company Restructuring Plan (2024-2025)

Key Idea: Most strategies were largely reactive rather than sustained competitive advantages.</pre></details></figure>
