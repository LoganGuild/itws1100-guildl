Net increase in the # of employees added to nonfarm payrolls.
Gross Job Gains
Sum of all jobs at new openings or existing businesses that are expanding.
Net Employment Change
Difference between gross job gains and gross job losses (from closing or businesses getting smaller).
Employment Population Ratio
Measures the share of the working-age population with a job.
Employment Growth Rate
Measures how much a company or industry’s headcount has increased over a specific time period.
Measures of Employment Gains</pre></details></figure>

<figure class="document-page"><figcaption>Page 4 of 13</figcaption><a href="pages/employment-inflation-presentation/04.webp" target="_blank" rel="noopener noreferrer" aria-label="Enlarge page 4 (new tab)"><img src="pages/employment-inflation-presentation/04.webp" width="1800" height="1013" loading="lazy" alt="Page 4 of Employment and Inflation Measures"></a><details><summary>Page 4 text</summary><pre>U-1 - Percentage of the labor force unemployed for 15 weeks or longer
U-2 - Percentage of the labor force who lost jobs or completed temporary work
U-3 - (OFFICIAL RATE) - Total unemployed individuals as a percentage of the civilian labor force
(Unemployed / Labor Force) * 100
U-4 - U-3 plus “discouraged workers” (people who stopped looking for jobs)
U-5 - U-4 plus people who can’t work or haven’t searched recently
U-6 - (Broadest) - U-5 plus people employed part-time for economic reasons
Measures of Employment Rates and Calculations</pre></details></figure>
<figure class="document-page"><figcaption>Page 5 of 13</figcaption><a href="pages/employment-inflation-presentation/05.webp" target="_blank" rel="noopener noreferrer" aria-label="Enlarge page 5 (new tab)"><img src="pages/employment-inflation-presentation/05.webp" width="1800" height="1013" loading="lazy" alt="Page 5 of Employment and Inflation Measures"></a><details><summary>Page 5 text</summary><pre>The U.S Bureau of Labor Statistics (BLS) computes and releases data on employment gains and unemployment rates
Data covers national, state, and local employment, unemployment, and labor force statistics
Only considers people who:
Either have a job or people who are jobless
Looking for a job
People who are available for work
Everyone else is not considered to be in the labor force and not considered within these statistics
Employment Gains and Unemployment Rates Responsibilities</pre></details></figure>

The Household Survey (current population survey) - collects data from a sample of residences about the people and conditions about them
The Establishment Survey (payroll data) - gathers data on employment, hours, and earnings from ~121,000 businesses and government agencies representing ~631,000 worksites. 
It provides crucial data on nonfarm payroll jobs to assess economic health

<figure class="document-page"><figcaption>Page 8 of 13</figcaption><a href="pages/employment-inflation-presentation/08.webp" target="_blank" rel="noopener noreferrer" aria-label="Enlarge page 8 (new tab)"><img src="pages/employment-inflation-presentation/08.webp" width="1800" height="1013" loading="lazy" alt="Page 8 of Employment and Inflation Measures"></a><details><summary>Page 8 text</summary><pre>Consumer Price Index (CPI)
Tracks prices of goods the average consumer buys
CPI = (Basket Cost Current Year) / (Basket Cost Base Year) * 100
Inflation Rate: (CPI Year 2 - CPI Year 1) / CPI Year 1 * 100
Personal Consumption Expenditures (PCE) price index
Changes in prices of goods and services
Calculated by total, inflation-adjusted, market-value spending on goods and services by households and nonprofit institutions
Producer Price Index (PPI)
Changes in the selling prices received by domestic producers for their output
Similar to CPI, but from the perspective of the producer
Gross Domestic Product (GDP) Deflator
Price changes of goods/services produced in a certain country
GDP Deflator = (Nominal GDP / Real GDP) * 100
Measures of Inflation</pre></details></figure>
